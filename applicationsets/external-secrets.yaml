apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-type: workload

  template:
    metadata:
      name: '{{nameNormalized}}-external-secrets'

    spec:
      project: default

      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 0.9.0
        helm:
          values: |
            serviceAccount:
              create: true
              name: external-secrets

      destination:
        server: '{{server}}'
        namespace: external-secrets

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true