apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clustermesh-apiserver
  namespace: kube-system

spec:
  secretName: clustermesh-apiserver-tls

  issuerRef:
    name: clustermesh-ca
    kind: ClusterIssuer

  commonName: clustermesh-apiserver

  dnsNames:
    - clustermesh-apiserver

  ipAddresses:
    - {{ .Values.clustermesh.loadBalancerIP | quote }}